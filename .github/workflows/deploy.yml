name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: elim-admin/dist/elim-admin/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: elim-admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: elim-admin

      # Build for THIS repo (Beni-NC/INEB_ELIM_Administrativ)
      - name: Build (primary)
        run: npx ng build --base-href /INEB_ELIM_Administrativ/ --output-path dist-primary
        working-directory: elim-admin

      - name: Copy index.html to 404.html (primary)
        run: cp elim-admin/dist-primary/browser/index.html elim-admin/dist-primary/browser/404.html

      - name: Upload primary artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: elim-admin/dist-primary/browser

      # Build for the MIRROR repo (beni-cioarba/ADM-TINERET) with its own base-href
      - name: Build (mirror)
        env:
          HAS_MIRROR_PAT: ${{ secrets.MIRROR_PAT != '' }}
        if: ${{ env.HAS_MIRROR_PAT == 'true' }}
        run: npx ng build --base-href /ADM-TINERET/ --output-path dist-mirror
        working-directory: elim-admin

      - name: Copy index.html to 404.html (mirror)
        env:
          HAS_MIRROR_PAT: ${{ secrets.MIRROR_PAT != '' }}
        if: ${{ env.HAS_MIRROR_PAT == 'true' }}
        run: cp elim-admin/dist-mirror/browser/index.html elim-admin/dist-mirror/browser/404.html

      - name: Deploy to mirror (beni-cioarba/ADM-TINERET)
        env:
          HAS_MIRROR_PAT: ${{ secrets.MIRROR_PAT != '' }}
        if: ${{ env.HAS_MIRROR_PAT == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MIRROR_PAT }}
          external_repository: beni-cioarba/ADM-TINERET
          publish_branch: gh-pages
          publish_dir: elim-admin/dist-mirror/browser
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
          force_orphan: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
