@if (visible()) {
  <div class="ui-menu" (click)="stop($event)">
    <button type="button"
            class="ui-btn"
            [class.ui-btn--ghost]="!withLabel()"
            [class.ui-btn--icon]="!withLabel()"
            [title]="'calendar.add_to_calendar' | translate"
            [attr.aria-label]="'calendar.add_to_calendar' | translate"
            [attr.aria-expanded]="open()"
            aria-haspopup="menu"
            (click)="toggle($event)">
      <span class="icon" aria-hidden="true">event_available</span>
      @if (withLabel()) { <span>{{ 'calendar.add_to_calendar_short' | translate }}</span> }
    </button>

    @if (open()) {
      <div class="ui-menu__panel" role="menu">
        <button type="button" class="ui-menu__item" role="menuitem" (click)="download($event)">
          <span class="icon" aria-hidden="true">download</span>
          <span class="ui-menu__text">
            <span class="ui-menu__title">{{ 'calendar.option_download_title' | translate }}</span>
            <span class="ui-menu__desc">{{ 'calendar.option_download_desc' | translate: { n: count() } }}</span>
          </span>
        </button>
        <button type="button" class="ui-menu__item" role="menuitem" (click)="subscribe($event)">
          <span class="icon" aria-hidden="true">sync</span>
          <span class="ui-menu__text">
            <span class="ui-menu__title">{{ 'calendar.option_subscribe_title' | translate }}</span>
            <span class="ui-menu__desc">{{ 'calendar.option_subscribe_desc' | translate }}</span>
          </span>
        </button>
        @if (copiedUrl(); as url) {
          <div class="ui-menu__note">
            <span class="ui-badge ui-badge--success">{{ 'calendar.copied' | translate }}</span>
            <code class="ui-menu__url">{{ url }}</code>
            <span class="ui-menu__desc">{{ 'calendar.subscribe_hint' | translate }}</span>
            @if (webcalUrl(); as webcal) {
              <a class="ui-link ui-menu__desc" [href]="webcal">{{ 'calendar.open_webcal' | translate }}</a>
            }
          </div>
        }
      </div>
    }
  </div>
}
