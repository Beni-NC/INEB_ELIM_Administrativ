<button type="button" class="ui-btn" [class.ui-btn--icon]="iconOnly()" [class.ui-btn--on-dark]="onDark()"
        (click)="open()" [attr.aria-label]="'share.button' | translate" [title]="'share.button' | translate">
  <span class="icon" aria-hidden="true">share</span>
  @if (!iconOnly()) { <span>{{ 'share.button' | translate }}</span> }
</button>

<dialog #dialogEl class="ui-dialog" [attr.aria-label]="'share.title' | translate"
        (click)="onBackdropClick($event)" (close)="onClosed()">
  @if (isOpen()) {
    <div class="ui-dialog__panel">
      <header class="ui-dialog__header">
        <h2 class="ui-dialog__title">{{ 'share.title' | translate }}</h2>
        <button type="button" class="ui-btn ui-btn--ghost ui-btn--icon" (click)="close()" [attr.aria-label]="'common.close' | translate">
          <span class="icon" aria-hidden="true">close</span>
        </button>
      </header>
      <p class="ui-dialog__text">{{ 'share.intro' | translate }}</p>

      <div class="share__grid">
        <a class="share__option" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
          <span class="share__badge share__badge--wa">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2m0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.54-3.7 8.24-8.24 8.24m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28"/></svg>
          </span>
          <span>WhatsApp</span>
        </a>
        <a class="share__option" [href]="telegramUrl" target="_blank" rel="noopener noreferrer">
          <span class="share__badge share__badge--tg">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M9.04 15.47 8.66 20.8c.54 0 .78-.23 1.06-.51l2.55-2.44 5.28 3.87c.97.53 1.65.25 1.91-.89l3.46-16.2c.31-1.42-.51-1.98-1.45-1.63L1.86 10.83c-1.39.54-1.37 1.31-.24 1.66l5.2 1.62L18.9 6.5c.57-.38 1.09-.17.66.21z"/></svg>
          </span>
          <span>Telegram</span>
        </a>
        <a class="share__option" [href]="emailUrl">
          <span class="share__badge"><span class="icon" aria-hidden="true">mail</span></span>
          <span>{{ 'share.email' | translate }}</span>
        </a>
        <button type="button" class="share__option" (click)="copy()">
          <span class="share__badge"><span class="icon" aria-hidden="true">{{ copied() ? 'check' : 'link' }}</span></span>
          <span>{{ (copied() ? 'share.copied' : 'share.copy') | translate }}</span>
        </button>
      </div>

      <code class="share__url">{{ url() }}</code>
    </div>
  }
</dialog>
